services:
  postgres:
    image: postgres:15
    container_name: eventhub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_EVENTHUB_DB:-eventhub}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_EVENTHUB_DB:-eventhub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-network

  postgres-analytics:
    image: postgres:15
    container_name: eventhub-postgres-analytics
    environment:
      POSTGRES_DB: ${POSTGRES_ANALYTICS_DB:-analytics}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "${POSTGRES_ANALYTICS_PORT:-5433}:5432"
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_ANALYTICS_DB:-analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-network

  postgres-authentication:
    image: postgres:15
    container_name: eventhub-postgres-authentication
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB:-auth_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "${POSTGRES_AUTH_PORT:-5434}:5432"
    volumes:
      - postgres_authentication_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_AUTH_DB:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-network

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: eventhub-zookeeper
    ports:
      - "2181:2181"
    networks:
      - eventhub-network

  kafka:
    image: wurstmeister/kafka:latest
    container_name: eventhub-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_ADVERTISED_HOST_NAME: ${KAFKA_HOST:-kafka}
      KAFKA_ZOOKEEPER_CONNECT: ${ZOOKEEPER_CONNECT:-zookeeper:2181}
      KAFKA_CREATE_TOPICS: "event-created:1:1, seat-reserved:1:1, seat-cancelled:1:1"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    networks:
      - eventhub-network

  event-service:
    build:
      context: .
      dockerfile: Dockerfile-event
    container_name: eventhub-event-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_EVENTHUB_DB:-eventhub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${EVENT_SERVICE_PORT:-8081}:8081"
    networks:
      - eventhub-network

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile-analytics
    container_name: eventhub-analytics-service
    depends_on:
      postgres-analytics:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-analytics:5432/${POSTGRES_ANALYTICS_DB:-analytics}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    ports:
      - "${ANALYTICS_SERVICE_PORT:-8082}:8082"
    networks:
      - eventhub-network

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile-auth
    container_name: eventhub-auth-service
    depends_on:
      postgres-authentication:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-authentication:5432/${POSTGRES_AUTH_DB:-auth_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "${AUTH_SERVICE_PORT:-8083}:8083"
    networks:
      - eventhub-network

  dashboard-service:
    build:
      context: .
      dockerfile: Dockerfile-dashboard
    container_name: eventhub-dashboard-service
    environment:
      SERVICES_AUTH: http://auth-service:${AUTH_SERVICE_PORT:-8083}
      SERVICES_EVENT: http://event-service:${EVENT_SERVICE_PORT:-8081}
      SERVICES_ANALYTICS: http://analytics-service:${ANALYTICS_SERVICE_PORT:-8082}
    ports:
      - "${DASHBOARD_SERVICE_PORT:-8084}:8084"
    networks:
      - eventhub-network
    depends_on:
      - auth-service
      - event-service
      - analytics-service


volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-postgres_data}
  postgres_analytics_data:
    name: ${POSTGRES_ANALYTICS_VOLUME_NAME:-postgres_analytics_data}
  postgres_authentication_data:
    name: ${POSTGRES_AUTH_VOLUME_NAME:-postgres_authentication_data}

networks:
  eventhub-network:
    driver: ${NETWORK_DRIVER:-bridge}
    name: ${NETWORK_NAME:-eventhub-network}