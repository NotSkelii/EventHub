<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EventHub - Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7fa;
        }

        header {
            background: #fffff5;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .user-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .logout-button {
            background-color: #be0808;
            color: #fffff1;
            padding: 8px 10px;
            border-radius: 50px;
            text-decoration: none;
            cursor: pointer;
        }

        .logout-button:hover {
            background-color: #640a0a;
        }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #fffff5;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 10px;
        }

        .section {
            background: #fffff5;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            margin-bottom: 20px;
            color: #333333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
        }

        .badge {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty a {
            color: #667eea;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #555;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: #f0f0f0;
            color: #333;
        }

        .nav-links .create-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .nav-links .create-btn:hover {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c0 100%);
            transform: translateY(-2px);
        }

        .action-buttons {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin: 0;
        }

        .quantity-input {
            width: 60px;
            padding: 5px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .reserve-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .reserve-btn:hover {
            background: #218838;
            transform: scale(1.02);
        }

        .cancel-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .cancel-btn:hover {
            background: #c82333;
            transform: scale(1.02);
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px 20px;
            border-radius: 50px;
            margin-bottom: 20px;
            text-align: center;
            border-left: 4px solid #28a745;
            font-weight: 500;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 20px;
            border-radius: 50px;
            margin-bottom: 20px;
            text-align: center;
            border-left: 4px solid #dc3545;
            font-weight: 500;
        }


    </style>
</head>
<body>
<header>
    <div class="logo"> EventHub</div>
    <div class="nav-links">
        <a href="/dashboard" class="nav-link">Dashboard</a>
        <a href="/events/create" class="create-btn">Create Event</a>
    </div>
    <div class="user-info">
        <span>Welcome, <strong th:text="${username}"></strong>(<span th:text="${role}"></span>)</span>
        <a href="/logout" class="logout-button">Logout</a>
    </div>
</header>

<div class="container">
    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" th:text="${eventCount}">0</div>
            <div class="stat-label">Total Events</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" th:text="${analyticsCount}">0</div>
            <div class="stat-label">Analytics Record</div>
        </div>
    </div>

    <div class="section">
        <h2>Upcoming Events</h2>

        <div th:if="${success}" class="success" th:text="${success}"></div>
        <div th:if="${error}" class="error" th:text="${error}"></div>

        <table th:if="${not #lists.isEmpty(events)}">
            <thead>
            <tr>
                <th>Name</th>
                <th>Venue</th>
                <th>City</th>
                <th>Category</th>
                <th>Date</th>
                <th>Seats</th>
                <th>Price</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events}">
                <td th:text="${event.name}"></td>
                <td th:text="${event.venue}"></td>
                <td th:text="${event.city}"></td>
                <td><span class="badge" th:text="${event.category}"></span></td>
                <td th:text="${#temporals.format(event.eventDate, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${event.availableSeats} + '/' + ${event.totalSeats}"></td>
                <td th:text="${event.price} + 'RON'"></td>
                <td>
                    <div class="action-buttons">
                        <form action="/events/reserve" method="post" class="action-form">
                            <input type="hidden" name="eventId" th:value="${event.id}">
                            <input type="number" name="quantity" value="1" min="1" th:max="${event.availableSeats}"
                                   class="quantity-input">
                            <button type="submit" class="reserve-btn">Reserve now!</button>
                        </form>
                        <form action="/events/cancel-reservation" method="post" class="action-form">
                            <input type="hidden" name="eventId" th:value="${event.id}">
                            <input type="number" name="quantity" value="1" min="1" class="quantity-input">
                            <button type="submit" class="cancel-btn">Cancel reservation</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty" th:if="${#lists.isEmpty(events)}">
            No upcoming events. Create one now!
        </div>
    </div>

    <div class="section">
        <h2> Analytics Events</h2>
        <table th:if="${not #lists.isEmpty(analytics)}">
            <thead>
            <tr>
                <th>Event Name</th>
                <th>Category</th>
                <th>City</th>
                <th>Received At</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${analytics}">
                <td th:text="${item.eventName}"></td>
                <td><span class="badge" th:text="${item.category}"></span></td>
                <td th:text="${item.city}"></td>
                <td th:text="${#temporals.format(item.receivedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
            </tr>
            </tbody>
        </table>
        <div class="empty" th:if="${#lists.isEmpty(analytics)}">
            No analytics data yet. Create events to see them here!
        </div>
    </div>
</div>
</body>
</html>
